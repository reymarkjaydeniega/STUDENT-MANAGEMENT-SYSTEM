<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | ROC Student Management System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { min-height: 100vh; background: #080d1c; color: white; display: flex; flex-direction: column; }
header {
    padding: 18px 5%;
    background: #101a31;
    border-bottom: 1px solid #263957;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}
header h1 { color: #38bdf8; letter-spacing: 4px; }
header p { color: #94a3b8; font-size: 11px; margin-top: 4px; letter-spacing: 2px; }
nav { display: flex; gap: 10px; flex-wrap: wrap; }
nav a {
    color: #94a3b8;
    text-decoration: none;
    padding: 9px 15px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    transition: .3s;
}
nav a:hover, nav a.active { background: #172554; color: #38bdf8; }
.header-right { display: flex; align-items: center; gap: 15px; }
#welcomeUser { color: #38bdf8; font-size: 14px; font-weight: bold; }
button {
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    transition: .3s;
}
button:hover { transform: translateY(-2px); filter: brightness(1.15); }
.danger-btn { background: #dc2626; color: white; }
main { width: 90%; max-width: 1200px; margin: 35px auto; flex: 1; }
h2 { color: #38bdf8; margin-bottom: 20px; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.course-card {
    background: #111a30;
    border: 1px solid #263957;
    border-radius: 15px;
    padding: 25px;
}
.course-card h3 { color: #38bdf8; font-size: 22px; margin-bottom: 10px; }
.course-card p { color: #94a3b8; margin-bottom: 6px; font-size: 14px; }
.course-card a {
    display: inline-block;
    margin-top: 14px;
    color: #38bdf8;
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
}
footer {
    text-align: center;
    padding: 22px;
    background: #0b1224;
    border-top: 1px solid #263957;
    color: #94a3b8;
    font-size: 12px;
    letter-spacing: 2px;
}
footer strong { color: #38bdf8; }
</style>
</head>
<body>
<header>
    <div>
        <h1>ROC</h1>
        <p>STUDENT MANAGEMENT SYSTEM</p>
    </div>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="students.html">Student Records</a>
        <a href="add-student.html">Add Student</a>
        <a href="courses.html" class="active">Courses</a>
    </nav>
    <div class="header-right">
        <span id="welcomeUser">Welcome!</span>
        <button class="danger-btn" onclick="logout()">LOGOUT</button>
    </div>
</header>

<main>
    <h2>Courses & Program Enrollment</h2>
    <div class="course-grid" id="courseGrid"></div>
</main>

<footer>
    <p>© 2026 ROC | STUDENT MANAGEMENT SYSTEM</p>
    <p>CREATED BY <strong>ROC</strong></p>
</footer>

<script>
function getStudents() {
    return JSON.parse(localStorage.getItem("rocStudents")) || [];
}
function logout() {
    if (confirm("Are you sure you want to logout?")) {
        sessionStorage.removeItem("rocLoggedIn");
        sessionStorage.removeItem("rocUserName");
        window.location.href = "index.html";
    }
}

window.onload = function() {
    const username = sessionStorage.getItem("rocLoggedIn");
    if (!username) {
        window.location.href = "index.html";
        return;
    }
    document.getElementById("welcomeUser").textContent = "Welcome, " + sessionStorage.getItem("rocUserName");

    const students = getStudents();
    const grid = document.getElementById("courseGrid");

    if (students.length === 0) {
        grid.innerHTML = `<p style="color:#94a3b8;">No courses available yet. Add students first.</p>`;
        return;
    }

    const courseMap = {};
    students.forEach(s => {
        const key = s.course.toUpperCase();
        if (!courseMap[key]) courseMap[key] = [];
        courseMap[key].push(Number(s.age));
    });

    Object.entries(courseMap).forEach(([course, ages]) => {
        const avgAge = (ages.reduce((a, b) => a + b, 0) / ages.length).toFixed(1);
        const card = document.createElement("div");
        card.className = "course-card";
        card.innerHTML = `
            <h3>${course}</h3>
            <p>Enrolled Students: <strong>${ages.length}</strong></p>
            <p>Average Age: <strong>${avgAge} yrs</strong></p>
            <a href="students.html?course=${encodeURIComponent(course)}">View Students in ${course} →</a>
        `;
        grid.appendChild(card);
    });
};
</script>
</body>
</html>
