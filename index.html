<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ROC Student Management System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #123d65 0%, transparent 40%),
        radial-gradient(circle at bottom right, #31215e 0%, transparent 40%),
        #080d1c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 35px;
    background: #111a30;
    border: 1px solid #2563a5;
    border-radius: 18px;
    box-shadow: 0 0 35px #0ea5e933;
}
.logo { text-align: center; margin-bottom: 25px; }
.logo h1 { color: #38bdf8; font-size: 42px; letter-spacing: 7px; }
.logo p { color: #94a3b8; font-size: 12px; letter-spacing: 3px; margin-top: 8px; }
h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #080d1c;
    color: white;
    outline: none;
}
input:focus { border-color: #38bdf8; }
button {
    width: 100%;
    border: none;
    padding: 13px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    background: #0ea5e9;
    color: white;
    margin-top: 12px;
    transition: .3s;
}
button:hover { transform: translateY(-2px); filter: brightness(1.15); }
.password-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #94a3b8;
    margin-top: 5px;
}
.password-toggle input { width: auto; margin: 0; }
.auth-switch { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 14px; }
.auth-switch span { color: #38bdf8; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div class="auth-card">
    <div class="logo">
        <h1>ROC</h1>
        <p>STUDENT MANAGEMENT SYSTEM</p>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
        <h2>Welcome Back</h2>
        <form onsubmit="login(event)">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <label class="password-toggle">
                <input type="checkbox" onchange="togglePassword('loginPassword', this)">
                Show password
            </label>
            <button type="submit">LOGIN</button>
        </form>
        <div class="auth-switch">
            Don't have an account? <span onclick="showRegister()">Create Account</span>
        </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">
        <h2>Create Account</h2>
        <form onsubmit="register(event)">
            <input type="text" id="registerName" placeholder="Full Name" required>
            <input type="text" id="registerUsername" placeholder="Create Username" required>
            <input type="password" id="registerPassword" placeholder="Create Password" minlength="6" required>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" minlength="6" required>
            <label class="password-toggle">
                <input type="checkbox" onchange="toggleRegisterPasswords(this)">
                Show passwords
            </label>
            <button type="submit">CREATE ACCOUNT</button>
        </form>
        <div class="auth-switch">
            Already have an account? <span onclick="showLogin()">Login Here</span>
        </div>
    </div>
</div>

<script>
function getAccounts() {
    return JSON.parse(localStorage.getItem("rocAccounts")) || [];
}
function saveAccounts(accounts) {
    localStorage.setItem("rocAccounts", JSON.stringify(accounts));
}
function showRegister() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
}
function showLogin() {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
}
function togglePassword(id, checkbox) {
    document.getElementById(id).type = checkbox.checked ? "text" : "password";
}
function toggleRegisterPasswords(checkbox) {
    const type = checkbox.checked ? "text" : "password";
    document.getElementById("registerPassword").type = type;
    document.getElementById("confirmPassword").type = type;
}
function register(event) {
    event.preventDefault();
    const name = document.getElementById("registerName").value.trim();
    const username = document.getElementById("registerUsername").value.trim();
    const password = document.getElementById("registerPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (password.length < 6) return alert("Password must be at least 6 characters.");
    if (password !== confirm) return alert("Passwords do not match!");

    const accounts = getAccounts();
    if (accounts.some(acc => acc.username.toLowerCase() === username.toLowerCase())) {
        return alert("Username already exists. Please choose another.");
    }

    accounts.push({ name, username, password });
    saveAccounts(accounts);
    alert("Account created successfully! You can now log in.");
    document.getElementById("registerForm").querySelector("form").reset();
    showLogin();
    document.getElementById("loginUsername").value = username;
}
function login(event) {
    event.preventDefault();
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;
    const account = getAccounts().find(
        item => item.username.toLowerCase() === username.toLowerCase() && item.password === password
    );

    if (!account) return alert("Incorrect username or password!");

    sessionStorage.setItem("rocLoggedIn", account.username);
    sessionStorage.setItem("rocUserName", account.name);
    window.location.href = "dashboard.html";
}
</script>
</body>
</html>
