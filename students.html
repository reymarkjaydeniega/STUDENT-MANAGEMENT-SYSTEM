<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Records | ROC Student Management System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { min-height: 100vh; background: #080d1c; color: white; display: flex; flex-direction: column; }
header {
    padding: 18px 5%;
    background: #101a31;
    border-bottom: 1px solid #263957;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}
header h1 { color: #38bdf8; letter-spacing: 4px; }
header p { color: #94a3b8; font-size: 11px; margin-top: 4px; letter-spacing: 2px; }
nav { display: flex; gap: 10px; flex-wrap: wrap; }
nav a {
    color: #94a3b8;
    text-decoration: none;
    padding: 9px 15px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    transition: .3s;
}
nav a:hover, nav a.active { background: #172554; color: #38bdf8; }
.header-right { display: flex; align-items: center; gap: 15px; }
#welcomeUser { color: #38bdf8; font-size: 14px; font-weight: bold; }
button, .btn {
    border: none;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    font-size: 13px;
    transition: .3s;
}
button:hover, .btn:hover { transform: translateY(-2px); filter: brightness(1.15); }
.primary-btn { background: #0ea5e9; color: white; }
.danger-btn { background: #dc2626; color: white; }
.edit-btn { background: #7c3aed; color: white; }
main { width: 90%; max-width: 1200px; margin: 35px auto; flex: 1; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
h2 { color: #38bdf8; }
.card { background: #111a30; border: 1px solid #263957; border-radius: 15px; padding: 25px; }
.filters { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
input, select {
    padding: 12px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #080d1c;
    color: white;
    outline: none;
}
input { flex: 1; min-width: 220px; }
input:focus, select:focus { border-color: #38bdf8; }
.table-wrapper { overflow-x: auto; }
table { width: 100%; min-width: 650px; border-collapse: collapse; }
th, td { padding: 15px; text-align: left; border-bottom: 1px solid #263957; }
th { background: #172554; color: #38bdf8; }
tr:hover { background: #1e293b; }
.actions { display: flex; gap: 7px; }
.empty-message { text-align: center; color: #94a3b8; padding: 25px; }
footer {
    text-align: center;
    padding: 22px;
    background: #0b1224;
    border-top: 1px solid #263957;
    color: #94a3b8;
    font-size: 12px;
    letter-spacing: 2px;
}
footer strong { color: #38bdf8; }
</style>
</head>
<body>
<header>
    <div>
        <h1>ROC</h1>
        <p>STUDENT MANAGEMENT SYSTEM</p>
    </div>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="students.html" class="active">Student Records</a>
        <a href="add-student.html">Add Student</a>
        <a href="courses.html">Courses</a>
    </nav>
    <div class="header-right">
        <span id="welcomeUser">Welcome!</span>
        <button class="danger-btn" onclick="logout()">LOGOUT</button>
    </div>
</header>

<main>
    <div class="top-bar">
        <h2>Student Records Directory</h2>
        <a href="add-student.html" class="btn primary-btn">+ ADD NEW STUDENT</a>
    </div>

    <section class="card">
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search by name, ID, age, or course..." oninput="displayStudents()">
            <select id="courseFilter" onchange="displayStudents()">
                <option value="">All Courses</option>
            </select>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Student ID</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 ROC | STUDENT MANAGEMENT SYSTEM</p>
    <p>CREATED BY <strong>ROC</strong></p>
</footer>

<script>
function getStudents() {
    return JSON.parse(localStorage.getItem("rocStudents")) || [];
}
function saveStudentsToStorage(students) {
    localStorage.setItem("rocStudents", JSON.stringify(students));
}
function logout() {
    if (confirm("Are you sure you want to logout?")) {
        sessionStorage.removeItem("rocLoggedIn");
        sessionStorage.removeItem("rocUserName");
        window.location.href = "index.html";
    }
}

function displayStudents() {
    const students = getStudents();
    const search = document.getElementById("searchInput").value.toLowerCase();
    const courseFilter = document.getElementById("courseFilter").value.toLowerCase();
    const table = document.getElementById("studentTable");
    table.innerHTML = "";
    let found = 0;

    students.forEach((student, index) => {
        const matchesSearch = [student.name, student.id, student.age, student.course]
            .some(val => String(val).toLowerCase().includes(search));
        const matchesCourse = !courseFilter || student.course.toLowerCase() === courseFilter;

        if (!matchesSearch || !matchesCourse) return;
        found++;

        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${student.name}</td>
            <td>${student.id}</td>
            <td>${student.age}</td>
            <td>${student.course}</td>
            <td>
                <div class="actions">
                    <button class="edit-btn" onclick="window.location.href='add-student.html?edit=${index}'">Edit</button>
                    <button class="danger-btn" onclick="deleteStudent(${index})">Delete</button>
                </div>
            </td>
        `;
        table.appendChild(row);
    });

    if (found === 0) {
        table.innerHTML = `<tr><td colspan="5" class="empty-message">No student records found.</td></tr>`;
    }
}

function deleteStudent(index) {
    if (!confirm("Are you sure you want to delete this student?")) return;
    const students = getStudents();
    students.splice(index, 1);
    saveStudentsToStorage(students);
    displayStudents();
}

window.onload = function() {
    const username = sessionStorage.getItem("rocLoggedIn");
    if (!username) {
        window.location.href = "index.html";
        return;
    }
    document.getElementById("welcomeUser").textContent = "Welcome, " + sessionStorage.getItem("rocUserName");

    const students = getStudents();
    const filter = document.getElementById("courseFilter");
    const uniqueCourses = [...new Set(students.map(s => s.course))];

    uniqueCourses.forEach(course => {
        const option = document.createElement("option");
        option.value = course.toLowerCase();
        option.textContent = course;
        filter.appendChild(option);
    });

    const params = new URLSearchParams(window.location.search);
    const courseParam = params.get("course");
    if (courseParam) {
        filter.value = courseParam.toLowerCase();
    }

    displayStudents();
};
</script>
</body>
</html>
